<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      padding: 16px;
      margin: 0;
      background: #fafafa;
      color: #333;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 16px;
      color: #1a73e8;
    }
    p {
      margin: 0 0 10px;
      font-size: 13px;
      line-height: 1.5;
    }
    .status {
      padding: 8px 12px;
      border-radius: 6px;
      background: #e8f5e9;
      color: #2e7d32;
      font-weight: 600;
      font-size: 13px;
      text-align: center;
    }
    .footer {
      margin-top: 12px;
      font-size: 11px;
      color: #999;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>🛡️ Viva Card Privacy Guard</h2>
  <p>
    This extension automatically <strong>unchecks</strong> the
    "Remember this card" checkbox on Viva payment pages so your
    card details are never stored without your explicit consent.
  </p>
  <div class="status">✔ Active &amp; protecting your payments</div>
  <div class="footer">Works on pay.vivapayments.com &amp; vivawallet.com</div>
</body>
</html>
